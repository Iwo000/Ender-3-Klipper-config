# Common pin mappings for the BIGTREETECH SKR mini E3 v2.0.
# from default config, modified by Henrik from that.
# See docs/Config_Reference.md for a description of parameters.
#[include input-shaper.cfg]
[include KAMP_Settings.cfg]
[include mainsail.cfg]
[include macros.cfg]

#enable log feedback
[respond]

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 39.839
#TODO - kan trenge kalibrering - 40.28
endstop_pin: ^PC0
position_endstop: 0
position_min:-0.5
position_max: 248
homing_speed: 100
#TODO: Legge inn position_endstop og position_min -- https://youtu.be/N41JY1Gukuk?t=1424

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 39.973
endstop_pin: ^PC1
position_endstop: -15
position_min:-15.5
position_max: 226
homing_speed: 100

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC2
#position_endstop: 0.0
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -1.3 #for å tillate kalibrering høyde

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 32.33 #7.9637 #8.21 #32.33 # kalibrert 2023-04-10 (var 33,5 originalt)
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.48
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 18.118 #21.527 - etter PID-kalibrering 2023-04-02, target 170
#pid_Ki: 0.795 #1.063
#pid_Kd: 103.274 #108.982
min_temp: 0
max_temp: 270
max_extrude_cross_section: 5

#[firmware_retraction]
#retract_length: 1.0
#retract_speed: 60
#unretract_extra_length: 0
#unretract_speed: 60

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7

[fan]
pin: PC6

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_33FFDB055356343519540143-if00
#restart_method: command

[temperature_sensor MCU]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor Pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 85

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3100
max_z_velocity: 5
max_z_accel: 100

[skew_correction]

[bed_screws]
screw1: 31,37
screw1_name: Front left screw
screw2: 31,208
screw2_name: Rear left screw
screw3: 201,208
screw3_name: Rear right screw
screw4: 201,37
screw4_name: Front right screw

[screws_tilt_adjust]
screw1: 77, 201
screw1_name: rear left screw
screw2: 77, 32
screw2_name: front left screw
screw3: 247, 32
screw3_name: front right screw
screw4: 247, 201
screw4_name: rear right screw
horizontal_move_z: 10
speed: 150
screw_thread: CW-M4

[bltouch]
sensor_pin: ^PC14 #var ^PC14
control_pin: PA1 #var PA1, v'rt PC13
x_offset: -49.3
y_offset: -8
#z_offset: 2.450 # etter litt testing, 2023-04-02 - Larger numbers move head closer to bed, smaller move it further away. (flyttet fra 2.825 -> 2.815)
#z_offset: 2.750 # 2024-01-05 etter 0.8-nozzle på; 2,815 - ca 1,5-1,8
probe_with_touch_mode: true
stow_on_each_sample: false
#  https://gist.github.com/joshschools/b642dd4355cf38edbb5310b1f385e37c
pin_move_time: 0.5
pin_up_touch_mode_reports_triggered: False
speed: 10
lift_speed: 20
samples: 2
sample_retract_dist: 5
samples_tolerance_retries: 3

[exclude_object]

[bed_mesh]
speed: 120
mesh_min: 30, 30
mesh_max: 190, 190
probe_count: 4,4
mesh_pps: 2,2
algorithm: bicubic
fade_start: 1
fade_end: 5 #orig 1
adaptive_margin: 0.5

[safe_z_home]
home_xy_position: 163, 135
speed: 75
z_hop: 6  #hvor mye opp - TODO; sette ned til 5 evt (var orig 10)
z_hop_speed: 5
move_to_previous: true

[static_digital_output usb_pullup_enable]
pins: !PA14

[input_shaper]
#shaper_type_x = mzv
#shaper_freq_x = 0
#shaper_type_y = mzv
#shaper_freq_y = 0


[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>
    #PROBE_IN=^PC2, PROBE_OUT=PA1 
    #TODO: Erstatte oppe i BLTOUCH-seksjon, og så sjekke at det funker.

[output_pin beeper]
pin: EXP1_1

[display]
# 128x64 Full Graphic Creality CR10 / ENDER 3 stockdisplay - fra samle-lcd.cfg
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

