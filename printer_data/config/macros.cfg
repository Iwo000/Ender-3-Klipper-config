# START G-CODE
;#M109 S0  ;sett hotend temp=0, ikke vent
;#M190 S0  ;sett bed temp, ikke vent
;SET_PRINT_STATS_INFO TOTAL_LAYER=[total_layer_count] ;for timing-info
;#send kommando til Klipper:
;_START_PRINT EXTRUDER_TEMP={first_layer_temperature[initial_extruder]} BED_TEMP={first_layer_bed_temperature[initial_extruder]}

# BEFORE_LAYER_CHANGE
; SET_PRINT_STATS_INFO CURRENT_LAYER={layer_num}

# END G-CODE
;END_PRINT

# Note - also enable firmware retraction in slicer! (G10/G11)

#######################################################################################

[gcode_macro ADAPTIVE_MESH]
gcode:
  BED_MESH_CALIBRATE ADAPTIVE=1
  BED_MESH_PROFILE SAVE="Adaptive"
  BED_MESH_PROFILE LOAD="Adaptive"

[gcode_macro G29]
gcode:
  G28
  BED_MESH_CALIBRATE PROFILE="hot_v8"
  BED_MESH_PROFILE LOAD="hot_v8"

[gcode_macro Tilt]
gcode:
  G28
  SCREWS_TILT_CALCULATE
  #SET_GCODE_OFFSET Z=-0.08

[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True


[gcode_macro _START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    # Start bed heating (but don't wait for it)
    M140 S{BED_TEMP}
    # Også starte opp hot end for å bli klar kjappere (men ikke vent) - hardkodet 150 grader (M104 er ikke vent, M109 er vent...)
    M104 S150
    # Use absolute coordinates
    G90
    #SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0
    # Reset the G-Code Z offset (adjust Z offset if needed)
    #SET_GCODE_OFFSET Z=0.0
    # Skew correction
    SKEW_PROFILE LOAD=my_skew_profile
    # Home the printer, all axis
    G28
    # Adaptive Mesh + Load mesh
    ADAPTIVE_MESH
    # Move to waiting location
    #G1 X10 Y10 Z5 F3000 
    Smart_Park #Replaces old witing position ^
    # Move the nozzle near the bed
    # G1 Z5 F3000
    # Move the nozzle very close to the bed
    #G1 Z0.15 F300
    # Wait for bed to reach temperature
    M190 S{BED_TEMP}
    # Set and wait for nozzle to reach temperature
    M109 S{EXTRUDER_TEMP}
    # Prime nozzle
    #_PRIME_LINE
    LINE_PURGE


# prime the nozzle (part of startup)
[gcode_macro _PRIME_LINE]
gcode: 
    #M117 Prime Line ;show text
    G1 X2 Y20 Z0.3 F5000.0 ; Move to start position
    G1 X2 Y200.0 Z0.3 F1500.0 E15 ; Draw the first line
    G1 X2.5 Y200.0 Z0.3 F5000.0 ; Move to side a little
    G1 X2.5 Y20 Z0.3 F1500.0 E30 ; Draw the second line
    G92 E0 ; Reset Extruder
    G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
    G1 X5 Y20 Z0.3 F5000.0 ; Move over to prevent blob squish


# power off button in macro section - sjekk om kald, skriver ut osv.
[gcode_macro POWER_OFF]
gcode:
  TURN_OFF_HEATERS
  # Disable steppers
  M84
  #wait for temp, then power
  UPDATE_DELAYED_GCODE ID=POWER_OFF_PRINTER_CHECK DURATION=1


# shut off power with TP-Link plug
[gcode_macro _POWER_OFF_PRINTER]
gcode:
    {action_call_remote_method("set_device_power",
                                device="printer",
                                state="off")}


[delayed_gcode POWER_OFF_PRINTER_CHECK]
#initial_duration: 100.
#initial_duration nå skrudd av, eller? Hva hvis skrur på; skrur aldri av?
gcode:
  {% if printer.idle_timeout.state == "Idle" or printer.idle_timeout.state == "Ready" %}
    {% if printer.extruder.temperature < 50.0 and printer.heater_bed.temperature < 55.0 %}
        {% if printer.extruder.target == 0.0 and printer.heater_bed.target == 0.0 %}
            # Hvis Idle/Ready, kald nok og target = 0 (dvs varmer ikke) - skru av
            UPDATE_DELAYED_GCODE ID=POWER_OFF_PRINTER_CHECK DURATION=0
            _POWER_OFF_PRINTER
            RESPOND TYPE=error MSG="Printer powered off by delayed gcode"
        {% else %}
            UPDATE_DELAYED_GCODE ID=POWER_OFF_PRINTER_CHECK DURATION=2 #prøv igjen om 2
        {% endif %}
    {% else %}
        {% if printer.idle_timeout.state == "Printing" %}
            UPDATE_DELAYED_GCODE ID=POWER_OFF_PRINTER_CHECK DURATION=0 #stopp sjekking
        {% else %}
            {% if printer.extruder.target == 0.0 and printer.heater_bed.target == 0.0 %}
                UPDATE_DELAYED_GCODE ID=POWER_OFF_PRINTER_CHECK DURATION=2
            {% else %}
                UPDATE_DELAYED_GCODE ID=POWER_OFF_PRINTER_CHECK DURATION=0
            {% endif %}
        {% endif %}
    {% endif %}
  {% endif %}


[gcode_macro _END_PRINT]
gcode:
  # Turn off bed, extruder, and fan
  TURN_OFF_HEATERS
  M140 S0
  M104 S0
  M106 S0
  # Raise nozzle w/relative positioning
  G91
  G1 Z10
  # Present print w/absolute positioning
  G90
  G1 X10 Y150
  # Disable steppers
  M84
  # Prepare for power off (start timer of 30 sec, then execute)
  UPDATE_DELAYED_GCODE ID=POWER_OFF_PRINTER_CHECK DURATION=30


[gcode_macro M300]
#from https://github.com/Klipper3d/klipper/blob/master/config/sample-macros.cfg
gcode:
    # Use a default 1kHz tone if S is omitted.
    {% set S = params.S|default(1000)|int %}
    # Use a 10ms duration is P is omitted.
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0


